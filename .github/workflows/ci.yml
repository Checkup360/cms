name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-placeholder' }}
      AUTH_SECRET: 'test-jwt-secret-key-checkup360'
      BACKEND_URL: 'http://localhost:8000'
      PUBLIC_WEB_ORIGIN: 'http://localhost:5173'
      DATABASE_URI: 'postgres://postgres:postgres@127.0.0.1:5432/checkup360_cms'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e '
          const s = require("./coverage/coverage-summary.json").total;
          const row = (k, v) => `| ${k} | ${v.pct}% |`;
          const md = [
            "### Coverage",
            "| Metric | % |",
            "| --- | --- |",
            row("Statements", s.statements),
            row("Branches", s.branches),
            row("Functions", s.functions),
            row("Lines", s.lines),
          ].join("\n");
          require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

      - name: Build
        run: pnpm build
